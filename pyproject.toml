[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athanor"
version = "2.8.0"
description = "ATHANOR: a deterministic coherence governor for recursive AI systems (ΔΦ → C → H7 → verdict)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Paul Jackson" }]
requires-python = ">=3.10"
keywords = ["coherence", "stability", "self-modification", "governor", "evolutionary", "map-elites", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.0", "twine>=5.0"]
# Bug2Eval regression suite + eval-gated config promotion (athanor evals / athanor registry)
evals = ["bug2eval @ git+https://github.com/jacksonjp0311-gif/bug2eval.git@v0.1.3"]
# AgentSearch evidence layer (athanor search; citations + stale-evidence checks). Python 3.11+ only.
search = ["agentsearch-local @ git+https://github.com/jacksonjp0311-gif/AgentSearch.git@v1.0.0-rc5 ; python_version >= '3.11'"]

[project.urls]
Homepage = "https://github.com/jacksonjp0311-gif/Athanor"
Source = "https://github.com/jacksonjp0311-gif/Athanor"
Issues = "https://github.com/jacksonjp0311-gif/Athanor/issues"
Changelog = "https://github.com/jacksonjp0311-gif/Athanor/blob/main/CHANGELOG.md"

[project.scripts]
athanor = "athanor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"athanor.evals" = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
