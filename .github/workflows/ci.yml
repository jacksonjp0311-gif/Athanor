name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Tests
        run: pytest -q
      - name: Determinism smoke (run -> verify -> replay)
        run: |
          athanor run --config configs/toy_experiment.yaml --out-dir "$RUNNER_TEMP/runs" --tag ci
          athanor verify "$RUNNER_TEMP/runs/ci"
          athanor replay "$RUNNER_TEMP/runs/ci"
          athanor replay "$RUNNER_TEMP/runs/ci" --out-dir "$RUNNER_TEMP/replay"
          athanor diff "$RUNNER_TEMP/runs/ci" "$(ls -d "$RUNNER_TEMP"/replay/run_*)"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/athanor --version
          /tmp/clean/bin/athanor bench --seeds 0 --out /tmp/bench
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
