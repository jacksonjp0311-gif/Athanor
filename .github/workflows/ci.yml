name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # eval tests snapshot historical commits
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[evals,search]"   # search is skipped on 3.10 by its marker
      - name: Tests
        run: pytest -q
      - name: Determinism smoke (run -> verify -> replay)
        run: |
          athanor run --config configs/toy_experiment.yaml --out-dir "$RUNNER_TEMP/runs" --tag ci
          athanor verify "$RUNNER_TEMP/runs/ci"
          athanor replay "$RUNNER_TEMP/runs/ci"
          athanor replay "$RUNNER_TEMP/runs/ci" --out-dir "$RUNNER_TEMP/replay"
          athanor diff "$RUNNER_TEMP/runs/ci" "$(ls -d "$RUNNER_TEMP"/replay/run_*)"
      - name: Operational commands (doctor, demo, adapter example, unified bench smoke)
        run: |
          athanor doctor
          athanor demo --out "$RUNNER_TEMP/demo" --skip-evals
          python examples/govern_quickstart.py
          athanor bench --all --seeds 3000 --steps 50 --workers 2 --out "$RUNNER_TEMP/bench_all"
      - name: Eval suite (Bug2Eval regression cases + registry integrity)
        run: |
          athanor registry verify
          athanor evals run --out "$RUNNER_TEMP/evals"
      - name: Evidence layer (AgentSearch, Python 3.11+)
        if: matrix.python-version != '3.10'
        run: |
          athanor search index
          athanor search grep "severe 30 vs 8" --scope docs
          athanor evals evidence --check
      - name: Search extra degrades gracefully on Python 3.10
        if: matrix.python-version == '3.10'
        run: |
          athanor search status | grep -q "needs Python 3.11"
          athanor evals evidence --check | grep -q "needs Python 3.11"
      - name: Core works without the evals extra
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/core && /tmp/core/bin/pip install -q -r requirements.txt -e .
          /tmp/core/bin/athanor --version
          (cd /tmp && /tmp/core/bin/athanor doctor && /tmp/core/bin/athanor demo --out /tmp/demo)
          /tmp/core/bin/athanor registry verify
          /tmp/core/bin/athanor evals run --out /tmp/ev | grep -q "bug2eval is not installed"
          /tmp/core/bin/athanor search status | grep -q "AgentSearch is not installed"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/athanor --version
          /tmp/clean/bin/athanor bench --seeds 0 --out /tmp/bench
          cd /tmp && /tmp/clean/bin/athanor doctor && /tmp/clean/bin/athanor demo --out /tmp/demo
          /tmp/clean/bin/python -c "import athanor; g = athanor.Governor(lambda p: [p, 2 * p]); print(g.judge(1.0, 1.01).verdict)"
          /tmp/clean/bin/athanor bench --all --seeds 3000 --steps 30 --workers 2 --out /tmp/bench_all
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
