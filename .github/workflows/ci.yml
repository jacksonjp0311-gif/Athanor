name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Tests
        run: pytest -q
      - name: Determinism smoke (run -> verify -> replay)
        run: |
          athanor run --config configs/toy_experiment.yaml --out-dir "$RUNNER_TEMP/runs" --tag ci
          athanor verify "$RUNNER_TEMP/runs/ci"
          athanor replay "$RUNNER_TEMP/runs/ci"
